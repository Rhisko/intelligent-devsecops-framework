apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dbank-app-02-staging-access
  namespace: argocd
  labels:
    app.kubernetes.io/name: dbank-app-02
    app.kubernetes.io/managed-by: argocd
    platform.company.io/environment: staging
spec:
  project: default
  source:
    repoURL: git@github.com:Rhisko/intelligent-devsecops-framework.git
    targetRevision: main
    path: infrastructure/gitops-ocp/ocp-tenant-governance/platform/namespace-access/staging/dbank-app-02
  destination:
    server: https://kubernetes.default.svc
    namespace: dbank-app-02-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true

