apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dbank-app-04-prod-access
  namespace: argocd
  labels:
    app.kubernetes.io/name: dbank-app-04
    app.kubernetes.io/managed-by: argocd
    platform.company.io/environment: prod
spec:
  project: default
  source:
    repoURL: git@github.com:Rhisko/intelligent-devsecops-framework.git
    targetRevision: main
    path: infrastructure/gitops-ocp/ocp-tenant-governance/platform/namespace-access/prod/dbank-app-04
  destination:
    server: https://kubernetes.default.svc
    namespace: dbank-app-04-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true

