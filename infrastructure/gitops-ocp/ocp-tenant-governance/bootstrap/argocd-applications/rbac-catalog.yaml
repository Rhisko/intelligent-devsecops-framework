apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespace-access-rbac-catalog
  namespace: argocd
  labels:
    app.kubernetes.io/name: namespace-access-rbac-catalog
    app.kubernetes.io/managed-by: argocd
    platform.company.io/managed-by: platform-team
spec:
  project: default
  source:
    repoURL: git@github.com:Rhisko/intelligent-devsecops-framework.git
    targetRevision: main
    path: infrastructure/gitops-ocp/ocp-tenant-governance/platform/rbac-catalog
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true

