apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: applicationaccesses.access.platform.company.io
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  group: access.platform.company.io
  scope: Cluster
  names:
    plural: applicationaccesses
    singular: applicationaccess
    kind: ApplicationAccess
    shortNames:
      - appaccess
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: ApplicationAccess records tenant namespace ownership and LDAP group access intent.
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - namespaces
                - environments
                - domain
                - repository
              properties:
                namespaces:
                  type: object
                  description: Namespace names keyed by environment.
                  properties:
                    dev:
                      type: string
                    staging:
                      type: string
                    prod:
                      type: string
                environments:
                  type: array
                  items:
                    type: string
                    enum:
                      - dev
                      - staging
                      - prod
                  minItems: 1
                domain:
                  type: string
                repository:
                  type: string
                owners:
                  type: array
                  items:
                    type: string
                  default: []
                operators:
                  type: array
                  items:
                    type: string
                  default: []
                viewers:
                  type: array
                  items:
                    type: string
                  default: []
                auditors:
                  type: array
                  items:
                    type: string
                  default: []
                deployers:
                  type: array
                  items:
                    type: string
                  default: []
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Domain
          type: string
          jsonPath: .spec.domain
        - name: Environments
          type: string
          jsonPath: .spec.environments
        - name: Repository
          type: string
          jsonPath: .spec.repository
