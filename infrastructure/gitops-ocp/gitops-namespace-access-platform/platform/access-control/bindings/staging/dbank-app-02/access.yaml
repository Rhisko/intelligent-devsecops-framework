apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dbank-app-02-owners
  namespace: dbank-app-02-staging
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: ocp-team-card
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: namespace-owner-limited
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dbank-app-02-operators
  namespace: dbank-app-02-staging
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: ocp-team-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: namespace-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dbank-app-02-viewers
  namespace: dbank-app-02-staging
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: ocp-team-security
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: ocp-team-digital-banking
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: namespace-readonly

