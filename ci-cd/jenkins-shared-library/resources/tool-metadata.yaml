ruff:
  image: ghcr.io/astral-sh/ruff:0.14.8
  command: "check {target} --no-cache --output-format json"
  output: json
  category: linter
  language: python

horusec:
  image: horuszup/horusec-cli:2.8.0
  command: "start -p {target} -o json"
  output: json
  category: sast

semgrep:
  image: semgrep/semgrep:1.146.0
  command: >
    semgrep scan 
    --config auto 
    --exclude '.git'
    --exclude 'node_modules'
    --exclude 'vendor'
    --exclude '.venv'
    --exclude '*.sample'
    --exclude 'hooks'
    {target}
    --json
    --output semgrep.json
  output: json
  category: sast


trivy:
  image: aquasec/trivy:0.68.2
  command: >
    trivy {scanType} {target}
    --severity {severity}
    --format json
    --output {output}
    {extraArgs}
  output: json
  category: image_scan
