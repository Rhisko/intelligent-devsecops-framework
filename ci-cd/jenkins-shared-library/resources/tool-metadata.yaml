ruff:
  image: ghcr.io/astral-sh/ruff:0.14.8
  command: "check {target} --no-cache --output-format json"
  output: json
  category: linter
  language: python

horusec:
  image: horuszup/horusec-cli:2.8.0
  command: "start -p {target} -o json"
  output: json
  category: sast

semgrep:
  image: semgrep/semgrep:1.146.0
  command: >
    semgrep scan 
    --config auto 
    --exclude '.git'
    --exclude 'node_modules'
    --exclude 'vendor'
    --exclude '.venv'
    --exclude '*.sample'
    --exclude 'hooks'
    {target}
    --json
    --output semgrep.json
  output: json
  category: sast


trivy:
  image: aquasec/trivy:0.68.2
  command: >
    {scanType}
    --severity {severity}
    --format json
    --output {output}
    {extraArgs}
    {target}
  output: json
  category: image_scan
  severity_mapping:
    CRITICAL: CRITICAL
    HIGH: HIGH
    MEDIUM: MEDIUM
    LOW: LOW

sonarqube:
  image: sonarsource/sonar-scanner-cli:12.0
  command: >
    sonar-scanner
    -Dsonar.projectKey={projectKey}
    -Dsonar.sources={sources}
    -Dsonar.host.url={hostUrl}
    -Dsonar.branch.name={branch}
  defaults:
    hostUrl: http://sonarqube:9000
    sources: .
    branch: main
    token: CREDS-SONAR-TOKEN
  category: code_quality
