ruff:
  image: ghcr.io/astral-sh/ruff:0.14.11
  command: >
    check {target}
    --no-cache
    --output-format {output_format}
    --select {select}
    --ignore {ignore}
    --output-file ruff.json
  language: python
  defaults:
    target: .
    select: F,E,W,B,I,INP,S,F401
    ignore: D203,D213
    output_format: json
  category: lint
  autofix: false
  severity_mapping:
    F401: LOW
    F841: LOW
    E: LOW
    W: LOW
    B: MEDIUM
    S: HIGH

horusec:
  image: horuszup/horusec-cli:2.8.0
  command: "start -p {target} -o json"
  output: json
  category: sast

semgrep:
  image: semgrep/semgrep:1.146.0
  command: >
    semgrep scan
    {ruleset}
    {extraArgs}
    {target}
    --json
    --output semgrep.json
  output: json
  category: sast


trivy:
  image: aquasec/trivy:0.68.2
  command: >
    {scanType}
    --severity {severity}
    --format json
    --output {output}
    {extraArgs}
    {target}
  output: json
  category: image_scan
  severity_mapping:
    CRITICAL: CRITICAL
    HIGH: HIGH
    MEDIUM: MEDIUM
    LOW: LOW

sonarqube:
  image: sonarsource/sonar-scanner-cli:12.0
  command: >
    sonar-scanner
    -Dsonar.projectKey={projectKey}
    -Dsonar.sources={sources}
    -Dsonar.host.url={hostUrl}
    -Dsonar.externalIssuesReportPaths={externalIssuesReportPaths}
    -Dsonar.qualitygate.wait={qualitygateWait}
    -Dsonar.qualitygate.timeout={qualitygateTimeout}
  # -Dsonar.branch.name={branch} // Only for enterprise edition
  defaults:
    hostUrl: http://sonarqube:9000
    sources: .
    branch: main
    externalIssuesReportPaths: 'sonar-external-issues.json'
  category: code_quality

ai_advisory:
  image: "ai-runner-advisory:v1.0.0"
  command: >
    python -m app.main
    --project-key {project_key}
    --analysis-mode {analysis_mode}
    --sonar-url {sonar_url}
    --output-file advisory_report.json
    --report-dir {report_dir}
  defaults:
    analysis_mode: "critical_analysis"
