[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-advisory-platform"
version = "0.1.0"
description = "CLI-first AI advisory platform for SonarQube findings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "python-dotenv>=1.0,<2",
  "tenacity>=8.2,<9",
  "langchain>=1.0,<2",
  "langchain-openai>=0.3,<1",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
